<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth API Test — cinemaportal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:active {
            transform: scale(0.98);
        }
        .response {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
            border-left: 4px solid #667eea;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }
        .response.success {
            border-left-color: #28a745;
            background: #f0fdf4;
        }
        .response.error {
            border-left-color: #dc3545;
            background: #fdf0f0;
        }
        .response pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #333;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .status.loading {
            background: #e7f3ff;
            color: #0066cc;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Auth API Test</h1>
        <div class="grid">
            <!-- Register -->
            <div class="card">
                <h2>📝 Register</h2>
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="reg-username" placeholder="ivan" value="ivan">
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="reg-email" placeholder="ivan@example.com" value="ivan@example.com">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="reg-password" placeholder="pass1234" value="pass1234">
                </div>
                <div class="form-group">
                    <label>Confirm Password:</label>
                    <input type="password" id="reg-password-confirm" placeholder="pass1234" value="pass1234">
                </div>
                <button onclick="register()">Register</button>
                <div id="reg-response"></div>
            </div>

            <!-- Login -->
            <div class="card">
                <h2>🔑 Login</h2>
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="login-username" placeholder="ivan" value="ivan">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="login-password" placeholder="pass1234" value="pass1234">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="login-use-cookie"> Use Cookie (httpOnly)
                    </label>
                </div>
                <button onclick="login()">Login</button>
                <div id="login-response"></div>
            </div>

            <!-- Logout -->
            <div class="card">
                <h2>🚪 Logout</h2>
                <div class="form-group">
                    <label>Refresh Token (from login):</label>
                    <textarea id="logout-refresh" placeholder="Paste refresh token here..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Access Token (for auth header):</label>
                    <textarea id="logout-access" placeholder="Paste access token here..." rows="3"></textarea>
                </div>
                <button onclick="logout()">Logout (Blacklist Refresh)</button>
                <div id="logout-response"></div>
            </div>

            <!-- Moderator Request -->
            <div class="card">
                <h2>⭐ Become Moderator</h2>
                <div class="form-group">
                    <label>Access Token (for auth):</label>
                    <textarea id="mod-access" placeholder="Paste access token here..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Message (optional):</label>
                    <textarea id="mod-message" placeholder="Why should I be a moderator?" rows="3"></textarea>
                </div>
                <button onclick="moderatorRequest()">Submit Moderator Request</button>
                <div id="mod-response"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        let currentAccessToken = null;
        let currentRefreshToken = null;

        function displayResponse(elementId, data, isError = false) {
            const elem = document.getElementById(elementId);
            const statusClass = isError ? 'error' : 'success';
            elem.innerHTML = `
                <div class="status ${statusClass}">
                    ${isError ? '❌ Error' : '✅ Success'}
                </div>
                <div class="response ${statusClass}">
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;
        }

        function displayTokens(accessToken, refreshToken) {
            currentAccessToken = accessToken;
            currentRefreshToken = refreshToken;
            document.getElementById('logout-access').value = accessToken || '';
            document.getElementById('logout-refresh').value = refreshToken || '';
            document.getElementById('mod-access').value = accessToken || '';
        }

        async function register() {
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const passwordConfirm = document.getElementById('reg-password-confirm').value;

            if (!username || !email || !password || !passwordConfirm) {
                displayResponse('reg-response', { error: 'All fields are required' }, true);
                return;
            }

            try {
                document.getElementById('reg-response').innerHTML = '<div class="status loading">⏳ Registering...</div>';
                const res = await fetch(`${API_BASE}/api/v1/auth/register/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, passwordConfirm })
                });
                const data = await res.json();
                if (data.success) {
                    displayResponse('reg-response', data);
                } else {
                    displayResponse('reg-response', data, true);
                }
            } catch (err) {
                displayResponse('reg-response', { error: err.message }, true);
            }
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const useCookie = document.getElementById('login-use-cookie').checked;

            if (!username || !password) {
                displayResponse('login-response', { error: 'Username and password are required' }, true);
                return;
            }

            try {
                document.getElementById('login-response').innerHTML = '<div class="status loading">⏳ Logging in...</div>';
                const res = await fetch(`${API_BASE}/api/v1/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, useCookie }),
                    credentials: useCookie ? 'include' : 'omit'
                });
                const data = await res.json();
                if (data.success && data.tokens) {
                    displayTokens(data.tokens.access, data.tokens.refresh);
                    displayResponse('login-response', data);
                } else if (data.success) {
                    displayResponse('login-response', data);
                } else {
                    displayResponse('login-response', data, true);
                }
            } catch (err) {
                displayResponse('login-response', { error: err.message }, true);
            }
        }

        async function logout() {
            const refresh = document.getElementById('logout-refresh').value;
            const access = document.getElementById('logout-access').value;

            if (!refresh || !access) {
                displayResponse('logout-response', { error: 'Both access and refresh tokens are required' }, true);
                return;
            }

            try {
                document.getElementById('logout-response').innerHTML = '<div class="status loading">⏳ Logging out...</div>';
                const res = await fetch(`${API_BASE}/api/v1/auth/logout/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${access}`
                    },
                    body: JSON.stringify({ refresh })
                });
                const data = await res.json();
                if (data.success) {
                    displayResponse('logout-response', { success: true, message: 'Logged out and refresh token blacklisted' });
                    currentAccessToken = null;
                    currentRefreshToken = null;
                } else {
                    displayResponse('logout-response', data, true);
                }
            } catch (err) {
                displayResponse('logout-response', { error: err.message }, true);
            }
        }

        async function moderatorRequest() {
            const access = document.getElementById('mod-access').value;
            const message = document.getElementById('mod-message').value;

            if (!access) {
                displayResponse('mod-response', { error: 'Access token is required' }, true);
                return;
            }

            try {
                document.getElementById('mod-response').innerHTML = '<div class="status loading">⏳ Submitting request...</div>';
                const res = await fetch(`${API_BASE}/api/v1/auth/moderator-request/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${access}`
                    },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                if (data.success) {
                    displayResponse('mod-response', data);
                } else {
                    displayResponse('mod-response', data, true);
                }
            } catch (err) {
                displayResponse('mod-response', { error: err.message }, true);
            }
        }
    </script>
</body>
</html>
